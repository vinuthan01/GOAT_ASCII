  </video>
  <script>
    (() => {
      const CH = " .,:;-~=+*vczxXZ#%&@|!";
      const BG = "#000000";
      const video = document.getElementById("source");
      const canvas = document.getElementById("art");
      const ctx = canvas.getContext("2d", { alpha: false });
      const bloom = document.getElementById("bloom");
      const bloomCtx = bloom.getContext("2d");
      const sampleCanvas = document.createElement("canvas");
      const sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });
      const font = size => size + 'px ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace';
      let dpr = 1, width = 0, height = 0, fontSize = 10, cellWidth = 6, cellHeight = 11;
      let columns = 0, rows = 0, glyphIndex, glyphRGB, luminance;
      let lastFrame = 0, resizeTimer = 0, animationId = 0;
      const motionPreference = window.matchMedia("(prefers-reduced-motion: reduce)");

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = canvas.width = Math.round(window.innerWidth * dpr);
        height = canvas.height = Math.round(window.innerHeight * dpr);
        bloom.width = Math.max(1, width >> 2);
        bloom.height = Math.max(1, height >> 2);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        fontSize = Math.max(5.4, Math.min(12, Math.max(window.innerWidth, window.innerHeight) / 300)) * dpr;
        ctx.font = font(fontSize);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        cellWidth = ctx.measureText("M").width;
        cellHeight = Math.round(fontSize * 1.12);
        columns = Math.min(720, Math.ceil(width / cellWidth));
        rows = Math.ceil(height / cellHeight);
        sampleCanvas.width = columns;
        sampleCanvas.height = rows;
        const count = columns * rows;
        glyphIndex = new Uint8Array(count);
        glyphRGB = new Uint8Array(count * 3);
        luminance = new Float32Array(count);
        if (motionPreference.matches && video.readyState >= 2) sample(performance.now());
        render(performance.now());
      }

      function sample(time) {
        const videoWidth = video.videoWidth;
        const videoHeight = video.videoHeight;
        const count = columns * rows;
        if (!videoWidth || !videoHeight || !count || video.readyState < 2) return;

        const canvasAspect = columns * cellWidth / (rows * cellHeight);
        const videoAspect = videoWidth / videoHeight;
        let sourceWidth = videoWidth, sourceHeight = videoHeight, sourceX = 0, sourceY = 0;
        if (canvasAspect > videoAspect) {
          sourceHeight = videoWidth / canvasAspect;
          sourceY = (videoHeight - sourceHeight) / 2;
        } else {
          sourceWidth = videoHeight * canvasAspect;
          sourceX = Math.min(videoWidth - sourceWidth, Math.max(0, videoWidth * .79 - sourceWidth / 2));
        }
        sampleCtx.imageSmoothingEnabled = true;
        sampleCtx.imageSmoothingQuality = "high";
        sampleCtx.drawImage(video, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, columns, rows);
        let pixels;
        try { pixels = sampleCtx.getImageData(0, 0, columns, rows).data; }
        catch (_) { return; }

        for (let k = 0; k < count; k++) {
          const p = k * 4;
          const r = pixels[p], g = pixels[p + 1], b = pixels[p + 2];
          luminance[k] = (.2126 * r + .7152 * g + .0722 * b) / 255;
          const color = k * 3;
          glyphRGB[color] = r;
          glyphRGB[color + 1] = g;
          glyphRGB[color + 2] = b;
        }

        for (let y = 0, k = 0; y < rows; y++) {
          for (let x = 0; x < columns; x++, k++) {
            const light = luminance[k];
            const left = x > 0 ? luminance[k - 1] : light;
            const right = x < columns - 1 ? luminance[k + 1] : light;
            const above = y > 0 ? luminance[k - columns] : light;
            const below = y < rows - 1 ? luminance[k + columns] : light;
            const local = (left + right + above + below) / 4;
            const color = k * 3;
            const darkest = Math.max(glyphRGB[color], glyphRGB[color + 1], glyphRGB[color + 2]);
            const edge = Math.min(1, Math.abs(right - left) * 2.2 + Math.abs(below - above) * 2.2 + Math.abs(light - local) * 1.4);
            const tonal = Math.max(0, Math.min(1, (light - .025) * 1.12));
            const structure = Math.min(1, edge * 2.6);
            const shade = Math.pow(tonal, .76) * (.34 + .66 * structure);
            if (darkest < 10 || shade < .045) {
              glyphIndex[k] = 0;
            } else {
              glyphIndex[k] = 1 + Math.min(CH.length - 2, (shade * (CH.length - 2)) | 0);
            }
          }
        }
      }

      function render(time) {
        if (!columns || !rows) return;
        ctx.fillStyle = BG;
        ctx.fillRect(0, 0, width, height);
        const left = (width - columns * cellWidth) / 2;
        const top = (height - rows * cellHeight) / 2;
        for (let y = 0, k = 0; y < rows; y++) {
          const drawY = Math.round(top + y * cellHeight + cellHeight / 2);
          for (let x = 0; x < columns; x++, k++) {
            const glyph = glyphIndex[k];
            if (!glyph) continue;
            const color = k * 3;
            ctx.fillStyle = "rgb(" + glyphRGB[color] + " " + glyphRGB[color + 1] + " " + glyphRGB[color + 2] + ")";
            ctx.fillText(CH[glyph], Math.round(left + x * cellWidth + cellWidth / 2), drawY);
          }
        }
        bloomCtx.clearRect(0, 0, bloom.width, bloom.height);
        bloomCtx.drawImage(canvas, 0, 0, bloom.width, bloom.height);
        lastFrame = time;
      }

      function animate(time) {
        if (motionPreference.matches) {
          animationId = 0;
          video.pause();
          sample(time);
          render(time);
          return;
        }
        animationId = requestAnimationFrame(animate);
        if (time - lastFrame < 33) return;
        sample(time);
        render(time);
      }

      function syncMotionPreference() {
        if (motionPreference.matches) {
          if (animationId) cancelAnimationFrame(animationId);
          animationId = 0;
          video.pause();
          if (video.readyState >= 2) {
            sample(performance.now());
            render(performance.now());
          }
          return;
        }
        video.play().catch(() => {});
        if (!animationId) animationId = requestAnimationFrame(animate);
      }

      video.addEventListener("loadeddata", () => {
        resize();
        syncMotionPreference();
      });
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 100);
      });
      if (motionPreference.addEventListener) motionPreference.addEventListener("change", syncMotionPreference);
      else motionPreference.addListener(syncMotionPreference);
      video.load();
      syncMotionPreference();
    })();
  </script>
